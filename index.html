<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#365b61">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Small Steps">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./icons/icon-180.png">
    <link rel="stylesheet" href="./styles.css?v=2">
    <title>Small Steps Coach</title>
  </head>
  <body>
    <a class="skip-link" href="#app">Skip to coach</a>
    <header class="app-header">
      <div>
        <p class="eyebrow">PRIVATE · ON THIS DEVICE</p>
        <h1>Small Steps</h1>
        <p id="date-line" class="muted"></p>
      </div>
      <div class="chapter-chip" aria-live="polite">
        <span id="chapter-label">Chapter 1</span>
        <strong id="chapter-progress">0 / 12</strong>
      </div>
    </header>

    <nav class="tabs" aria-label="Coach sections">
      <button data-tab="home" aria-current="page">Today</button>
      <button data-tab="plan">Plan ahead</button>
      <button data-tab="unstick">Unstick me</button>
      <button data-tab="story">Story</button>
      <button data-tab="review">Review</button>
      <button data-tab="settings">Settings</button>
    </nav>

    <main id="app" tabindex="-1">
      <noscript>This coach needs JavaScript enabled to save your choices on this device.</noscript>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <dialog id="clue-dialog">
      <div class="dialog-body">
        <p class="eyebrow">NEW CLUE</p>
        <h2 id="clue-title">The Lantern Room</h2>
        <p id="clue-text"></p>
        <button class="primary" id="close-clue" type="button">Continue</button>
      </div>
    </dialog>

    <script src="./data.js?v=1"></script>
    <script src="./state.js?v=1"></script>
    <script src="./app.js?v=4"></script>
    <script>
      if ("serviceWorker" in navigator && location.protocol !== "file:") {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("./sw.js");
        });
      }
    </script>
  </body>
</html>
